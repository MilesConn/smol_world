[package]
name = "smol_world"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

# Optimize for size in release builds (important for WASM)
[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
strip = true
